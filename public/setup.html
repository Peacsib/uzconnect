<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uzConnect - Production Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .result h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .credentials {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .credentials div {
            margin: 8px 0;
        }
        
        .credentials strong {
            display: inline-block;
            width: 100px;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .stats div {
            margin: 5px 0;
        }
        
        .login-btn {
            margin-top: 20px;
            background: #28a745;
        }
        
        .login-btn:hover {
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 uzConnect Production Setup</h1>
        <p class="subtitle">Click the button below to set up your coordinator account and clean demo data</p>
        
        <button id="setupBtn" onclick="runSetup()">Run Production Setup</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Setting up your account...</p>
        </div>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        async function runSetup() {
            const btn = document.getElementById('setupBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            // Disable button and show loading
            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                const response = await fetch('https://uzconnect-backend.onrender.com/api/v1/setup-production');
                const data = await response.json();
                
                loading.style.display = 'none';
                result.style.display = 'block';
                
                if (response.ok && data.status === 'success') {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>✅ ${data.message}</h3>
                        
                        <div class="credentials">
                            <div><strong>Name:</strong> ${data.credentials.name}</div>
                            <div><strong>Email:</strong> ${data.credentials.email}</div>
                            <div><strong>Password:</strong> ${data.credentials.password}</div>
                            <div><strong>Role:</strong> ${data.credentials.role}</div>
                        </div>
                        
                        <div class="stats">
                            <strong>Database Status:</strong>
                            <div>Total Users: ${data.database_stats.total_users}</div>
                            <div>Coordinators: ${data.database_stats.coordinators}</div>
                            <div>Students: ${data.database_stats.students}</div>
                            <div>Lecturers: ${data.database_stats.lecturers}</div>
                            <div>Supervisors: ${data.database_stats.supervisors}</div>
                        </div>
                        
                        <p style="margin-top: 15px; font-weight: 600;">⚠️ Change your password after first login!</p>
                        
                        <button class="login-btn" onclick="window.open('${data.credentials.login_url}', '_blank')">
                            Login Now →
                        </button>
                    `;
                } else {
                    throw new Error(data.message || 'Setup failed');
                }
            } catch (error) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = `
                    <h3>❌ Setup Failed</h3>
                    <p>${error.message}</p>
                    <p style="margin-top: 15px;">Please try again or contact support.</p>
                `;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
