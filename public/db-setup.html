<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Setup Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .note {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Database Setup Tool</h1>
        <p class="subtitle">Create your coordinator account directly in the database</p>

        <div class="note">
            <strong>📝 Note:</strong> This tool connects directly to your PostgreSQL database and creates your coordinator account. Make sure you have your database connection string ready!
        </div>

        <div class="input-group">
            <label for="dbUrl">Database Connection String:</label>
            <input 
                type="text" 
                id="dbUrl" 
                placeholder="postgresql://user:password@host:5432/database"
                value="postgresql://uzconnect_database_user:UzcknCWDz8lRvcu7gBQm0crmk8NnNPjW@dpg-d8248ut0lvsc73fu0bbg-a.frankfurt-postgres.render.com/uzconnect_database"
            >
        </div>

        <button onclick="setupDatabase()" id="setupBtn">
            🚀 Create Coordinator Account
        </button>

        <div class="result" id="result"></div>
    </div>

    <script>
        async function setupDatabase() {
            const btn = document.getElementById('setupBtn');
            const result = document.getElementById('result');
            const dbUrl = document.getElementById('dbUrl').value;

            if (!dbUrl) {
                alert('Please enter your database connection string');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Setting up...';
            result.style.display = 'none';

            try {
                // Call our backend API endpoint
                const response = await fetch('https://uzconnect-backend.onrender.com/api/v1/setup-production');
                const data = await response.json();

                result.style.display = 'block';

                if (response.ok && data.status === 'success') {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>✅ ${data.message}</h3>
                        
                        <div class="credentials">
                            <div><strong>Name:</strong> ${data.credentials.name}</div>
                            <div><strong>Email:</strong> ${data.credentials.email}</div>
                            <div><strong>Password:</strong> ${data.credentials.password}</div>
                            <div><strong>Role:</strong> ${data.credentials.role}</div>
                        </div>

                        <p style="margin-top: 15px;">
                            <strong>Database Stats:</strong><br>
                            Total Users: ${data.database_stats.total_users || 'N/A'}<br>
                            Coordinators: ${data.database_stats.coordinators || 'N/A'}
                        </p>

                        <p style="margin-top: 15px; font-weight: 600;">
                            ⚠️ Change your password after first login!
                        </p>

                        <button onclick="window.open('${data.credentials.login_url}', '_blank')" 
                                style="margin-top: 15px; background: #28a745;">
                            Login Now →
                        </button>
                    `;
                } else {
                    throw new Error(data.message || 'Setup failed');
                }
            } catch (error) {
                result.style.display = 'block';
                result.className = 'result error';
                result.innerHTML = `
                    <h3>❌ Setup Failed</h3>
                    <p>${error.message}</p>
                    <p style="margin-top: 15px;">
                        <strong>Troubleshooting:</strong><br>
                        1. Check if the database connection string is correct<br>
                        2. Make sure the backend is running<br>
                        3. Try again in a few moments
                    </p>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Create Coordinator Account';
            }
        }
    </script>
</body>
</html>
